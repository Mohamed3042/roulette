<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Roulette</title>
<meta name="description" content="A first-person revolver that decides for you. Load your choices, aim, fire at the paper.">
<meta name="theme-color" content="#0b0907">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Roulette">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="vendor/fonts/fonts.css">
<link rel="modulepreload" href="vendor/three/three.module.js">
<link rel="stylesheet" href="app.css">
</head>
<body>

<canvas id="gl" aria-label="First-person view: your hand holds a revolver, a paper target stands across the room. Click or tap to fire; the chamber under the hammer is your pick."></canvas>
<svg id="leaders" aria-hidden="true"></svg>
<div id="labels" aria-hidden="true"></div>
<div id="cross" data-style="dot" aria-hidden="true"><i></i><b></b></div>

<div id="chrome" hidden>
  <header id="top">
    <div class="top-l">
      <div class="mark">Roulette</div>
      <button class="chip" id="choices-btn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="7.2" r="1.7"/><circle cx="16.2" cy="14.4" r="1.7"/><circle cx="7.8" cy="14.4" r="1.7"/></svg><span id="count">6 choices</span></button>
    </div>
    <div class="chips">
      <button class="chip" id="custom-btn" type="button" aria-label="Customize"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg><span>Customize</span></button>
      <button class="chip icon" id="sound-btn" type="button" aria-pressed="true" aria-label="Sound on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path class="wave" d="M15.5 9a4.5 4.5 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/><path class="mute" d="M16 9.5l5 5M21 9.5l-5 5"/></svg></button>
    </div>
  </header>
  <div id="keys" aria-hidden="true"><span><kbd>Click</kbd> fire</span><span><kbd>Right</kbd> aim</span><span><kbd>R</kbd> spin</span><span><kbd>F</kbd> inspect</span><span><kbd>E</kbd> choices</span><span><kbd>C</kbd> customize</span><span><kbd>M</kbd> sound</span></div>
  <button id="spin-btn" class="round" type="button" aria-label="Spin the cylinder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v4.5h-4.5"/></svg><span>Spin</span></button>
  <button id="ads-btn" class="round big" type="button" aria-label="Hold to aim down the sights"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><path d="M12 1.5v4M12 18.5v4M1.5 12h4M18.5 12h4"/></svg><span>Aim</span></button>
</div>

<div id="hint" role="status"></div>

<section id="coach" class="paper" hidden aria-live="polite"><div class="dots"><i></i><i></i><i></i></div><p id="coach-text"></p></section>

<section id="result" class="paper" hidden aria-live="polite">
  <div class="eyebrow stagger">Your pick</div>
  <div id="result-word" class="stagger">Walk</div>
  <p id="result-sub" class="stagger">A suggestion. You decide.</p>
  <div class="r-actions stagger">
    <button class="btn solid" id="again" type="button">Again <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v4.5h-4.5"/></svg></button>
    <button class="btn line" id="change" type="button">Change choices</button>
  </div>
</section>

<div id="custom" class="overlay" hidden>
  <div class="c-sheet paper" role="dialog" aria-modal="true" aria-labelledby="c-title">
    <div class="c-head"><h2 id="c-title">Customize</h2><button type="button" class="c-close" aria-label="Close">&#215;</button></div>
    <div class="c-tabs" role="tablist"></div>
    <div class="c-body"></div>
  </div>
</div>

<div id="veil"><div class="intro-mark">Roulette</div><p id="veil-status">Loading the room&#8230;</p></div>

<div id="touch" aria-hidden="true"></div>
<div id="toast" role="status"></div>
<div id="fade" aria-hidden="true"></div>

<script src="vendor/gsap.min.js"></script>
<script type="importmap">{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
